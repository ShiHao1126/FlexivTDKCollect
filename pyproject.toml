[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "flexiv-tdk-collect"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = ["numpy", "opencv-python", "typed-argument-parser>=1.12"]

[tool.setuptools.packages.find]
include = ["flexiv_tdk_collect*"]
